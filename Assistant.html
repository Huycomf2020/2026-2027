<!doctype html><html lang="vi"><head><base target="_top"><style>body{font:14px Arial,sans-serif;padding:14px;color:#123;background:#f4f8fb}h2{color:#075985}textarea{width:100%;height:110px;box-sizing:border-box;padding:10px;border:1px solid #bdd5df;border-radius:10px;resize:vertical}button{width:100%;margin-top:10px;padding:11px;border:0;border-radius:10px;background:#087e9c;color:white;font-weight:bold;cursor:pointer}#answer{margin-top:14px;background:#fff;padding:12px;border-radius:10px;white-space:pre-wrap;line-height:1.5;min-height:60px}</style></head><body><h2>🤖 Trợ lý Đoàn trường</h2><p>Hỏi về quy định, điểm danh hoặc bảng xếp hạng thi đua.</p><textarea id="q" placeholder="Ví dụ: Tóm tắt top 5 lớp thi đua tuần này"></textarea><button onclick="ask()">Gửi câu hỏi</button><div id="answer">Sẵn sàng hỗ trợ bạn.</div><script>function ask(){const a=document.getElementById('answer');a.textContent='Đang phân tích...';google.script.run.withSuccessHandler(x=>a.textContent=x).withFailureHandler(e=>a.textContent='Lỗi: '+e.message).askSchoolAssistant(document.getElementById('q').value)}</script></body></html>
