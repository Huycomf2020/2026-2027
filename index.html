Hiện tại Google chưa phát hành phiên bản model mang tên `gemini-3.6-flash` hay `gemini-3.8-flash` (các dòng thế hệ 1.5 và 2.0/2.5 mới nhất hiện có là `gemini-1.5-flash` hoặc `gemini-2.0-flash`). Tuy nhiên, đoạn mã bên dưới đã được cấu hình chuẩn theo đúng yêu cầu của thầy: **lấy API Key trực tiếp từ Thuộc tính của tập lệnh (`ScriptProperties`)** bằng khóa `GEMINI_API_KEY` như trong hình ảnh, bảo mật an toàn tuyệt đối và không để lộ Key ra ngoài.

Đoạn mã Google Apps Script hoàn chỉnh để thầy dán thẳng vào trình biên soạn:

```javascript
function callGemini() {
  // 1. Lấy API Key từ Script Properties (Thuộc tính của tập lệnh)
  const apiKey = PropertiesService.getScriptProperties().getProperty('GEMINI_API_KEY');
  
  if (!apiKey) {
    Logger.log("Lỗi: Chưa cài đặt 'GEMINI_API_KEY' trong Thuộc tính của tập lệnh.");
    return;
  }

  // 2. Chọn model (Có thể thay đổi tên model tại đây, ví dụ: gemini-1.5-flash hoặc gemini-2.0-flash)
  const modelName = "gemini-1.5-flash"; 
  const url = `[https://generativelanguage.googleapis.com/v1beta/models/$](https://generativelanguage.googleapis.com/v1beta/models/$){modelName}:generateContent?key=${apiKey}`;

  // 3. Nội dung câu hỏi/yêu cầu gửi tới AI
  const promptText = "Xin chào, hãy giới thiệu ngắn gọn về bản thân bạn.";

  const payload = {
    "contents": [
      {
        "parts": [
          { "text": promptText }
        ]
      }
    ]
  };

  const options = {
    "method": "post",
    "contentType": "application/json",
    "payload": JSON.stringify(payload),
    "muteHttpExceptions": true
  };

  try {
    // 4. Gửi yêu cầu API
    const response = UrlFetchApp.fetch(url, options);
    const json = JSON.parse(response.getContentText());

    if (json.candidates && json.candidates.length > 0) {
      const resultText = json.candidates[0].content.parts[0].text;
      Logger.log("KẾT QUẢ TỪ GEMINI:\n" + resultText);
      return resultText;
    } else {
      Logger.log("Lỗi phản hồi: " + JSON.stringify(json));
    }
  } catch (e) {
    Logger.log("Lỗi kết nối: " + e.toString());
  }
}
