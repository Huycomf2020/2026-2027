<!doctype html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Huycomf2020/2026-2027/main/images/Logo3D%20thpt%20LocNinh.png">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root{--navy:#062c43;--cyan:#0891b2;--sky:#e0f2fe;--gold:#f59e0b;--ink:#102a3a;--muted:#637889;--card:#fff;--bg:#f4f8fb;--danger:#dc2626;--radius:22px;--shadow:0 16px 45px rgba(6,44,67,.10)}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 90% 0,#cffafe 0,transparent 28%),var(--bg);font-family:'Be Vietnam Pro',sans-serif;color:var(--ink)}
    button,input,select{font:inherit} button{cursor:pointer}.shell{min-height:100vh;display:flex;flex-direction:column}.top{background:linear-gradient(120deg,#041f30,#075985 70%,#0e7490);color:#fff;padding:22px clamp(18px,5vw,70px);box-shadow:0 10px 35px rgba(2,32,49,.2)}
    .brand{max-width:1250px;margin:auto;display:flex;align-items:center;gap:16px}.brand img{width:68px;height:68px;object-fit:contain;filter:drop-shadow(0 6px 12px rgba(0,0,0,.2))}.brand h1{font-size:clamp(19px,3vw,31px);margin:0;font-weight:800}.brand p{margin:5px 0 0;color:#bae6fd;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
    .nav{max-width:1250px;margin:20px auto -45px;display:flex;gap:8px;background:rgba(255,255,255,.12);backdrop-filter:blur(16px);padding:8px;border:1px solid rgba(255,255,255,.18);border-radius:18px;width:max-content;flex-wrap:wrap;}.nav button{border:0;border-radius:13px;background:transparent;color:#dff7ff;font-weight:700;padding:12px 18px;transition:.2s}.nav button:hover,.nav button.active{color:var(--navy);background:#fff;box-shadow:0 8px 22px rgba(0,0,0,.14)}
    main{width:min(1250px,calc(100% - 30px));margin:58px auto 40px;flex:1}.panel{display:none}.panel.active{display:block;animation:rise .28s ease}@keyframes rise{from{opacity:0;transform:translateY(8px)}}
    .hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.hero h2{font-size:clamp(25px,4vw,42px);margin:0;color:var(--navy)}.hero p{margin:7px 0 0;color:var(--muted)}.periods{display:flex;gap:6px;background:#e7f0f5;padding:5px;border-radius:14px}.periods button{border:0;border-radius:10px;padding:9px 13px;background:transparent;font-weight:700;color:#526a78}.periods button.active{background:#fff;color:var(--cyan);box-shadow:0 5px 15px #bfd2dc}
    .podium{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:18px 0}.winner{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}.winner:first-child{background:linear-gradient(145deg,#fff8dc,#fff)}.winner .rank{font-size:28px}.winner b{font-size:25px;display:block;margin:8px 0}.winner span{color:var(--muted)}
    
    .grade-container{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:22px 0;}
    .grade-card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
    .grade-card h4{margin:0 0 12px;font-size:16px;color:var(--cyan);border-bottom:2px solid var(--sky);padding-bottom:6px;display:flex;justify-content:space-between;}

    .grid2{display:grid;grid-template-columns:1.35fr .65fr;gap:18px}.card{background:var(--card);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)}.card h3{margin:0 0 18px}.chartbox{height:370px}.table-wrap{overflow:auto}.ranking{width:100%;border-collapse:collapse}.ranking th,.ranking td{padding:13px 12px;border-bottom:1px solid #e7eef2;text-align:left}.ranking th{font-size:12px;text-transform:uppercase;color:var(--muted)}.badge{background:#e0f2fe;color:#0369a1;border-radius:99px;padding:5px 9px;font-weight:700;font-size:12px}
    .rules{display:grid;gap:12px}.rule{background:#fff;border-radius:18px;padding:18px 20px;box-shadow:0 8px 24px rgba(6,44,67,.06);display:flex;gap:16px}.rule-num{width:38px;height:38px;flex:0 0 auto;border-radius:12px;background:var(--sky);display:grid;place-items:center;font-weight:800;color:#0369a1}.empty{text-align:center;padding:60px 15px;color:var(--muted)}
    .attendance-head{display:flex;justify-content:space-between;gap:15px;align-items:center}.session{background:#ecfeff;color:#0e7490;padding:10px 14px;border-radius:13px;font-weight:700}.search{width:100%;margin:18px 0;padding:14px 17px;border:1px solid #d8e6ed;border-radius:14px;outline:none}.search:focus{border-color:var(--cyan);box-shadow:0 0 0 4px #cffafe}.classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:9px}.class-btn{border:1px solid #dce8ee;background:#fff;padding:12px;border-radius:13px;font-weight:800;color:var(--navy)}.class-btn:hover{border-color:var(--cyan);color:var(--cyan);transform:translateY(-2px)}
    
    /* GIAO DIỆN ĐIỂM DANH ĐA LỰA CHỌN NÂNG CẤP */
    .student{display:grid;grid-template-columns:50px minmax(180px,1.2fr) minmax(340px,2fr);align-items:center;gap:12px;padding:14px;border-bottom:1px solid #edf2f5}.student-name b{display:block}.student-name small{color:var(--muted)}
    .statuses{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .status{border:1px solid #dce6eb;background:#fff;border-radius:10px;padding:9px 4px;font-size:12px;font-weight:600;transition:.2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;}
    .status.selected{background:#075985;color:#fff;border-color:#075985}
    .status[data-s="Vắng có phép"].selected{background:#64748b;color:#fff;border-color:#64748b}
    .status[data-s="Vắng không phép"].selected{background:#dc2626;color:#fff;border-color:#dc2626}
    .status[data-s="Đi trễ"].selected{background:#f59e0b;color:#fff;border-color:#f59e0b}
    .status.rule-btn.selected{background:#7c3aed;color:#fff;border-color:#7c3aed}
    
    .rule-checkbox-item{display:flex;align-items:center;gap:10px;background:#f8fafc;padding:12px;border-radius:12px;border:1px solid #e2e8f0;cursor:pointer;}
    .rule-checkbox-item:hover{background:#f1f5f9;}
    .rule-checkbox-item input[type="checkbox"]{width:18px;height:18px;cursor:pointer;}
    .rule-text-content{flex:1;font-size:13px;}
    .rule-badge{background:#fee2e2;color:#dc2626;font-weight:700;padding:3px 8px;border-radius:6px;font-size:12px;}

    .btn-resolve {background:#10b981; color:#fff; border:0; border-radius:8px; padding:6px 12px; font-weight:700; font-size:12px; cursor:pointer;}
    .btn-del {background:#ef4444; color:#fff; border:0; border-radius:8px; padding:6px 10px; font-weight:700; font-size:12px; cursor:pointer;}
    .btn-appeal{background:#f59e0b;color:#fff;border:0;border-radius:8px;padding:6px 10px;font-weight:700;font-size:12px}.appeal-pending{background:#fee2e2;color:#b91c1c;padding:5px 8px;border-radius:8px;font-weight:700;font-size:12px}.upload-box{border:2px dashed #bae6fd;border-radius:16px;padding:18px;background:#f0f9ff;margin-top:16px}.upload-box input{width:100%;margin:10px 0}
    
    .save{border:0;background:linear-gradient(120deg,#0891b2,#0369a1);color:#fff;border-radius:14px;padding:13px 22px;font-weight:800;box-shadow:0 8px 22px #bae6fd}
    .modal{position:fixed;inset:0;background:rgba(3,27,41,.65);backdrop-filter:blur(6px);display:none;place-items:center;z-index:20}.modal.open{display:grid}.modal-card{width:min(650px,calc(100% - 24px));max-width:100%;background:#fff;border-radius:24px;padding:24px;box-shadow:0 30px 90px rgba(0,0,0,.28);box-sizing:border-box;overflow:hidden;}.modal-card h3{font-size:21px;margin:0}.modal-card input[type="password"], .modal-card input[type="email"]{width:100%;padding:14px;border:1px solid #d6e1e7;border-radius:13px;margin:8px 0}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:12px;}.secondary{border:0;background:#edf3f6;padding:11px 16px;border-radius:12px}.toast{position:fixed;right:22px;bottom:22px;background:#07334a;color:#fff;border-radius:14px;padding:13px 18px;box-shadow:var(--shadow);transform:translateY(100px);opacity:0;transition:.3s;z-index:30}.toast.show{transform:none;opacity:1}
    
    .assistant-modal-body{display:flex;align-items:center;gap:15px;}
    .assistant-img{width:110px;height:auto;object-fit:contain;flex-shrink:0;}

    footer{text-align:center;color:#738796;padding:20px;font-weight:600;} footer a{color:var(--cyan);text-decoration:none;} footer a:hover{text-decoration:underline;}
    .loader{width:25px;height:25px;border:3px solid #c7dce6;border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite;margin:35px auto}@keyframes spin{to{transform:rotate(360deg)}}

    @media(max-width:800px){.grid2,.grade-container{grid-template-columns:1fr}.podium{grid-template-columns:1fr}.hero,.attendance-head{align-items:flex-start;flex-direction:column}.nav{width:100%;justify-content:stretch}.nav button{flex:1;padding:11px 5px;font-size:12px}.student{grid-template-columns:40px 1fr}.statuses{grid-column:1/-1;grid-template-columns:repeat(2,1fr)}.brand img{width:54px;height:54px}.modal-card{padding:18px 14px;}.assistant-modal-body{flex-direction:column;text-align:center;}.assistant-img{width:90px;}}
  </style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><img src="https://raw.githubusercontent.com/Huycomf2020/2026-2027/main/images/Logo3D%20thpt%20LocNinh.png" alt="Logo THPT Lộc Ninh"><div><h1>Đoàn trường THPT Lộc Ninh</h1><p>Tuổi trẻ • Tiên phong • Trách nhiệm</p></div></div>
    <nav class="nav">
      <button data-page="rules">📜 Quy định</button>
      <button data-page="attendance">✅ Điểm danh</button>
      <button class="active" data-page="competition">🏆 Thi đua</button>
      <button data-page="homeroom">🏫 GVCN & Sơ đồ lớp</button>
      <button data-page="adminLog">👁️ BGH & GVCN</button>
      <button data-page="support">🛠️ Hỗ trợ</button>
    </nav>
  </header>
  <main>
    <!-- TAB THI ĐUA -->
    <section id="competition" class="panel active">
      <div class="hero">
        <div><h2>🏆 Bảng vàng thi đua</h2><p>Thành tích nổi bật của các chi đoàn (Công thức Chuẩn hóa 2026)</p></div>
        <div class="periods"><button class="active" data-period="week">Tuần</button><button data-period="period">Tháng</button><button data-period="semester">Học kỳ</button><button data-period="year">Năm</button></div>
      </div>
      <div id="podium" class="podium"></div>
